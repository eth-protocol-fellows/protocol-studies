<svg width="100%" viewBox="0 0 520 340" role="img" style="background: rgb(255, 255, 255); border-radius: 8px;" xmlns="http://www.w3.org/2000/svg">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Req/Resp exchange flow</title>
<defs>
<marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrowL" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Column headers -->
<rect x="60" y="16" width="120" height="36" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" style="fill:rgb(204, 251, 241);stroke:rgb(13, 148, 136);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<text x="120" y="39" text-anchor="middle" fill="#0d9488" style="font-size:13px;font-weight:600;font-family:sans-serif;fill:rgb(13, 148, 136);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:13px;font-weight:600;text-anchor:middle;dominant-baseline:auto">Requester</text>

<rect x="340" y="16" width="120" height="36" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1" style="fill:rgb(237, 233, 254);stroke:rgb(124, 58, 237);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<text x="400" y="39" text-anchor="middle" fill="#7c3aed" style="font-size:13px;font-weight:600;font-family:sans-serif;fill:rgb(124, 58, 237);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:13px;font-weight:600;text-anchor:middle;dominant-baseline:auto">Responder</text>

<!-- Lifelines -->
<line x1="120" y1="56" x2="120" y2="320" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.35" style="fill:rgb(0, 0, 0);stroke:rgb(13, 148, 136);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-dasharray:6px, 4px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.35;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<line x1="400" y1="56" x2="400" y2="320" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.35" style="fill:rgb(0, 0, 0);stroke:rgb(124, 58, 237);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-dasharray:6px, 4px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.35;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

<!-- Step 1: Open stream -->
<line x1="120" y1="90" x2="396" y2="90" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrowR)" style="fill:rgb(0, 0, 0);stroke:rgb(13, 148, 136);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<text x="258" y="82" text-anchor="middle" fill="#1e293b" style="font-size:11px;font-weight:500;font-family:sans-serif;fill:rgb(30, 41, 59);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:500;text-anchor:middle;dominant-baseline:auto">1. Open new stream</text>

<!-- Step 2: Send request -->
<line x1="120" y1="145" x2="396" y2="145" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrowR)" style="fill:rgb(0, 0, 0);stroke:rgb(13, 148, 136);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<text x="258" y="130" text-anchor="middle" fill="#1e293b" style="font-size:11px;font-weight:500;font-family:sans-serif;fill:rgb(30, 41, 59);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:500;text-anchor:middle;dominant-baseline:auto">2. Send request</text>
<text x="258" y="165" text-anchor="middle" fill="#64748b" style="font-size:10px;font-family:sans-serif;fill:rgb(100, 116, 139);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:middle;dominant-baseline:auto">(SSZ-encoded, Snappy-compressed, length-prefixed)</text>

<!-- Step 3: Response code + data -->
<line x1="400" y1="210" x2="124" y2="210" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowL)" style="fill:rgb(0, 0, 0);stroke:rgb(124, 58, 237);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<text x="258" y="195" text-anchor="middle" fill="#1e293b" style="font-size:11px;font-weight:500;font-family:sans-serif;fill:rgb(30, 41, 59);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:500;text-anchor:middle;dominant-baseline:auto">3. Response code + data</text>
<text x="258" y="230" text-anchor="middle" fill="#64748b" style="font-size:10px;font-family:sans-serif;fill:rgb(100, 116, 139);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:middle;dominant-baseline:auto">(0 = success, 1 = error, 2 = unknown error)</text>

<!-- Step 4: Close stream -->
<line x1="120" y1="285" x2="396" y2="285" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowR)" style="fill:rgb(0, 0, 0);stroke:rgb(148, 163, 184);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-dasharray:5px, 3px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<text x="258" y="270" text-anchor="middle" fill="#1e293b" style="font-size:11px;font-weight:500;font-family:sans-serif;fill:rgb(30, 41, 59);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:500;text-anchor:middle;dominant-baseline:auto">4. Stream closes</text>

</svg>